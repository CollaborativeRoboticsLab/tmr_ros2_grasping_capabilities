motion_execution_node:
  ros__parameters:
    action_name: move_arm_to_pose
    named_pose_action_name: move_arm_to_named_pose
    move_group_action_name: move_action
    planning_group: tmr_arm
    planning_frame: base
    end_effector_link: flange
    allowed_planning_time: 5.0
    num_planning_attempts: 5
    max_velocity_scaling: 0.2
    max_acceleration_scaling: 0.2
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.1
    planning_pipeline_id: ''
    planner_id: ''
    compute_ik_service: /compute_ik
    joint_state_topic: /joint_states
    planning_joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
    prefer_nearby_ik: true
    fallback_to_pose_planning_on_ik_failure: true
    joint_state_timeout_sec: 0.5
    ik_timeout_sec: 0.2
    joint_goal_tolerance_rad: 0.001
    log_joint_goal_deltas: false
    poses_names: ["workspace_center", "pre_grasp", "grasp_pose", "post_grasp"]
    poses_values:
      workspace_center:
        pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]
        target_frame: base
      pre_grasp:
        pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]
        target_frame: base
      grasp_pose:
        pose: [0.0, 0.0, 0.20, 0.0, 0.0, 0.0]
        target_frame: base
      post_grasp:
        pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]
        target_frame: base