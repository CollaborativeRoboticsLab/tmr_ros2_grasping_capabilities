%YAML 1.1
---
name: MoMaGraspingLaunchRunner
spec_type: provider
spec_version: 1.2
description: "Launches the MoMa robot stack and its TM12 grasping motion server."
implements: omron_grasping_capabilities/MoMaGraspingLaunchRunner
runner: omron_grasping_capabilities/grasping.launch.py
depends_on:
  "nav2_capabilities/Nav2LaunchRunner":
    provider: "omron_moma_capabilities/MoMaNav2LaunchRunner"
definition:
  launch_readiness:
    action:
      name: move_arm_to_pose
      type: grasping_msgs/action/MoveToPose
      timeout: 90.0