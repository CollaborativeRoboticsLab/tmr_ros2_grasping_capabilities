%YAML 1.1
---
name: TmrGraspingLaunchRunner
spec_type: provider
spec_version: 1.2
description: "Launches the TMR TM12X driver, MoveIt, and grasping motion server."
implements: tmr_ros2_grasping_capabilities/TmrGraspingLaunchRunner
runner: tmr_ros2_grasping_capabilities/grasping.launch.py
definition:
  launch_readiness:
    action:
      name: move_arm_to_pose
      type: grasping_msgs/action/MoveToPose
      timeout: 90.0