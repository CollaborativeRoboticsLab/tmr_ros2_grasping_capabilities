%YAML 1.1
---
name: TmrMoveToNamedPoseRunner
spec_type: provider
spec_version: 1.2
description: "TMR TM12X named-pose motion provider using the generic grasping runner."
implements: tmr_ros2_grasping_capabilities/TmrMoveToNamedPoseRunner
runner: capabilities2_runner::MoveToNamedPoseRunner
depends_on:
  "grasping_capabilities/GraspingLaunchRunner":
    provider: "tmr_ros2_grasping_capabilities/TmrGraspingLaunchRunner"
definition:
  command: "<Runner interface=tmr_ros2_grasping_capabilities/TmrMoveToNamedPoseRunner provider=tmr_ros2_grasping_capabilities/TmrMoveToNamedPoseRunner pose_name='$pose_name' />"
  configuration_parameters:
    - name: pose_name
      type: string
      semantic_key: grasping.named_pose.name
      description: "Name of a pose listed by the TMR motion configuration."