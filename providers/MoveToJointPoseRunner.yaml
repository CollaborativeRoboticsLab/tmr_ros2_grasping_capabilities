%YAML 1.1
---
name: TmrMoveToJointPoseRunner
spec_type: provider
spec_version: 1.2
description: "TMR TM12X joint-space motion provider using the generic grasping runner."
implements: tmr_ros2_grasping_capabilities/TmrMoveToJointPoseRunner
runner: capabilities2_runner::MoveToJointPoseRunner
depends_on:
  "grasping_capabilities/GraspingLaunchRunner":
    provider: "tmr_ros2_grasping_capabilities/TmrGraspingLaunchRunner"
definition:
  command: "<Runner interface=tmr_ros2_grasping_capabilities/TmrMoveToJointPoseRunner provider=tmr_ros2_grasping_capabilities/TmrMoveToJointPoseRunner joint_names='$joint_names' joint_positions='$joint_positions' />"
  configuration_parameters:
    - name: joint_names
      type: string[]
      semantic_key: grasping.joint_goal.names
      description: "Ordered TMR TM12X joint names for the target."
    - name: joint_positions
      type: double[]
      semantic_key: grasping.joint_goal.positions
      description: "Ordered target joint positions in radians matching joint_names."