%YAML 1.1
---
name: MoMaMoveToJointPoseRunner
spec_type: provider
spec_version: 1.2
description: "MoMa TM12 joint-space motion provider using the generic grasping runner."
implements: omron_grasping_capabilities/MoMaMoveToJointPoseRunner
runner: capabilities2_runner::MoveToJointPoseRunner
depends_on:
  "grasping_capabilities/GraspingLaunchRunner":
    provider: "omron_grasping_capabilities/MoMaGraspingLaunchRunner"
definition:
  command: "<Runner interface=omron_grasping_capabilities/MoMaMoveToJointPoseRunner provider=omron_grasping_capabilities/MoMaMoveToJointPoseRunner joint_names='$joint_names' joint_positions='$joint_positions' />"
  configuration_parameters:
    - name: joint_names
      type: string[]
      semantic_key: grasping.joint_goal.names
      description: "Ordered TM12 joint names for the target."
    - name: joint_positions
      type: double[]
      semantic_key: grasping.joint_goal.positions
      description: "Ordered target joint positions in radians matching joint_names."